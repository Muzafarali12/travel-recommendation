<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TravelBloom - Contact Us</title><link rel="stylesheet" href="style.css"></head><body>
<nav>
  <span class="logo">TravelBloom</span>
  <ul>
    <li><a href="index.html" >Home</a></li>
    <li><a href="about.html" >About Us</a></li>
    <li><a href="contact.html" class="active">Contact Us</a></li>
  </ul>
  
</nav>
<main><h2>Contact Us</h2>
<form id="contactForm">
<div><label for="name">Name</label><input id="name" name="name" required></div>
<div><label for="email">Email</label><input id="email" name="email" type="email" required></div>
<div><label for="message">Message</label><textarea id="message" name="message" rows="5" required></textarea></div>
<button type="submit">Send message</button>
<p id="thanks" role="status"></p>
</form></main>
<script>document.getElementById('contactForm').addEventListener('submit',function(e){e.preventDefault();document.getElementById('thanks').textContent='Thank you! Your message has been sent.';this.reset();});</script>
</body></html>
